<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors</title>
    <link rel="stylesheet" href="./src/style.css">
    <script defer src="./src/script.js"></script>
</head>
<body>
    <header>ROCK PAPER SCISSORS</header>
    <section>
        <div class="score">
            <div class="text">
                <h2>O primeiro a fazer 5 ganha</h2>
            </div>
            <div class="scoreboard">
                <div class="human score-box">
                    <div class="choice">?</div>
                    <div class="score">Human: 0</div>
                </div>

                <div class="computer score-box">
                    <div class="choice">?</div>
                    <div class="score">Computer: 0</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="text">Escolha sua jogada</div>
            <div class="options">
                <button id="rock">👊</button>
                <button id="paper">🖐️</button>
                <button id="scissors">✌️</button>
            </div>
        </div>
    </section>
    <footer>&#169; Pietro Pereira - 2026</footer>
</body>
</html>
