<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors</title>
    <link rel="stylesheet" href="./src/style.css">
    <script defer src="./src/script.js"></script>
</head>
<body>
    <header>ROCK PAPER SCISSORS</header>
    <section>
        <div class="scoreSection">
            <div class="text">
                <h2>Choose below to start</h2>
                <h3>The first to get 5 points win</h3>
            </div>
            <div class="scoreboard">
                <div class="human score-box">
                    <div class="choice">?</div>
                    <div class="score">Human: <span>0</span></div>
                </div>

                <div class="computer score-box">
                    <div class="choice">?</div>
                    <div class="score">Computer: <span>0</span></div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="text">Choose your move</div>
            <div class="options">
                <button id="rock">👊</button>
                <button id="paper">🖐️</button>
                <button id="scissors">✌️</button>
            </div>
        </div>
    </section>
    <footer>&#169; Pietro Pereira - 2026</footer>

    <div class="modal">
        <div class="modal-content">
            <p></p>
            <button id="again">Play again</button>
        </div>
    </div>
</body>
</html>
